[ingestable]
name = "rating-ingest"
type = "sql"

[sql]
dialect = "postgres"
topic = "rating"
connectionString = "postgres://test:${CATALOG_DB_PASSWORD}@db:5432/catalog?sslmode=disable"
primaryKey = "movie_id"
tables = ["ingress.rating"]
mapAllColumns = true

[sql.options]
slotName = "committed_rating_slot"
publication = "committed_rating_pub"
